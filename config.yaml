# 运行参数。密钥只从环境变量读取，本文件不含任何凭据。
# 切分、top_k、融合权重、rerank 候选数在实验结论落定前属实验变量，可通过 configs/ 覆盖。

corpus:
  docs_dir: corpus/docs
  manifest: corpus/metadata/manifest.json
  v01_subset:
    - 中华人民共和国专利法_20201017_ff808081.docx
    - 专利代理条例_20181106_ff808081.docx
  full:
    dir: corpus/docs

ingest:
  max_file_mb: 20
  max_unpacked_mb: 100
  max_failure_rate: 0.10

db:
  path_env: RAG_DB_PATH
  migrations_dir: specs/06-schemas/migrations

paths:
  data_dir: data
  index_dir: data/index
  runs_dir: data/runs
  trace_file: data/trace.jsonl
  pdf_refs_dir: data/pdf-refs

model:
  embedding_name: BAAI/bge-small-zh-v1.5
  embedding_dim: 512
  embedding_revision: main
  batch_size: 16
  device: cpu
  cache_env: HF_HOME
  rerank_name: BAAI/bge-reranker-base

split:
  strategy: fixed
  chunk_size: 512
  overlap: 64

retrieval:
  top_k: 5
  candidate_k: 20
  rrf_k: 60
  rerank_top_n: 20
  rerank_timeout_ms: 3000
  use_bm25: true    # 默认链＝基线「向量 + BM25 融合」（CHG-007）；本值的追认与回滚见 CHG-008
  use_rerank: false  # v0.3 实验三区间重叠，未启用

eval:
  cases_file: evals/cases.csv
  bootstrap_rounds: 1000
  metrics:
    - recall@1
    - recall@3
    - recall@5
    - mrr
    - ndcg@5
    - hitrate@5

run:
  seed: 20261116
  normalizer_version: 0

server:
  api_host: 127.0.0.1
  api_port: 8000
  ui_port: 8501
  # Agent 页面独立端口（CHG-013 §6；app.py／8501 不动）
  ui_port_agent: 8502

# Agent 配额与运行参数（CHG-013 §7）。三项上限只可下调：max_turns / max_tool_calls_per_turn / max_context_turns
agent:
  max_turns: 2
  timeout_seconds: 30
  max_calls_per_question: 2
  max_calls_per_session: 20
  max_tool_calls_per_turn: 3
  max_context_turns: 3
  max_tool_chars: 2000
  session_ttl_hours: 24

llm:
  # 以下三个 *_env 是覆盖入口（向后兼容）：环境变量有值就用环境变量的值。
  # 只有 key 是密钥，绝不写进文件；模型名与接口地址非密钥，写在下面的字面值里（CHG-012）。
  api_key_env: RAG_LLM_API_KEY
  base_url_env: RAG_LLM_BASE_URL
  model_env: RAG_LLM_MODEL
  model_name: deepseek-flash
  base_url: https://api.deepseek.com
  timeout_seconds: 30
  max_calls: 50

logging:
  level: INFO
  excerpt_max_chars: 80
